name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # check-history reads every commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-node-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Generate the synthetic corpus
        run: |
          git ls-files --error-unmatch web/corpus/synthetic-10k.bin.sha256
          mkdir -p web/corpus
          cargo run --release --locked --example gen_corpus -- web/corpus/synthetic-10k.bin 156 2 16
          git diff --exit-code -- web/corpus/synthetic-10k.bin.sha256
      - name: Node tests
        run: node --test tests/node.test.mjs tests/charts.test.mjs
      - name: Check the tree for keys
        run: node scripts/check-no-keys.mjs
      - name: Check the history for keys
        run: node scripts/check-history.mjs

  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Cargo tests
        run: cargo test --release --locked
