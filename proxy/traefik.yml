# Adapted from red-dev-inc/WebZjs traefik/ at c0457174 (MIT OR Apache-2.0, https://github.com/red-dev-inc/WebZjs).
# Changes: file provider only, no docker socket, no dashboard, no API, allowOrigins limited to the pages that use the proxy, the
# published ports pinned to 127.0.0.1, the image pinned by digest, routers limited to the four calls the harness makes, a rate limit.
# Static configuration. The access log records the address of whoever uses the proxy.
global:
  sendAnonymousUsage: false
  checkNewVersion: false
log:
  level: INFO
accessLog: {}
entryPoints:
  rocks:
    address: :80
  global:
    address: :81
providers:
  file:
    filename: /etc/traefik/conf/dynamic.yml
